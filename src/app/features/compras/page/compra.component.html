<app-overlay [mostrar]="mostrarOverlay()" [mensagem]="mensagemOverlay()" (closed)="fecharOverlay()"></app-overlay>
<form autocomplete='off'>
  <div class="table-container">
    <br>
    <h2>Compras</h2>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let element">{{ element.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <ng-container matColumnDef="quantidadeIngressos">
        <th mat-header-cell *matHeaderCellDef>Quant. de Ingressos Comprados</th>
        <td mat-cell *matCellDef="let element">{{ element.quantidadeIngressos }}</td>
      </ng-container>

      <ng-container matColumnDef="dataCompra">
        <th mat-header-cell *matHeaderCellDef>Data da Compra</th>
        <td mat-cell *matCellDef="let element">{{ element.dataCompra }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletar(element.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="8" showFirstLastButtons></mat-paginator>
    <br>
    <button class='btn block-cube block-cube-hover btn-secondary' type='button' (click)="voltar()">
      <div class='bg-top'>
        <div class='bg-inner'></div>
      </div>
      <div class='bg-right'>
        <div class='bg-inner'></div>
      </div>
      <div class='bg'>
        <div class='bg-inner'></div>
      </div>
      <div class='text'>
        Voltar
      </div>
    </button>
  </div>
</form>  
  <app-sidebar></app-sidebar>
