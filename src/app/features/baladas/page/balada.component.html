<app-overlay [mostrar]="mostrarOverlay()" [mensagem]="mensagemOverlay()" (closed)="fecharOverlay()"></app-overlay>
  <div class="table-container">
    <br>
    <h2>Baladas</h2>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="nomeEvento">
        <th mat-header-cell *matHeaderCellDef>Evento</th>
        <td mat-cell *matCellDef="let element">{{ element.nomeEvento }}</td>
      </ng-container>

      <ng-container matColumnDef="local">
        <th mat-header-cell *matHeaderCellDef>Local</th>
        <td mat-cell *matCellDef="let element">{{ element.local }}</td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let element">{{ element.data}}</td>
      </ng-container>

      <ng-container matColumnDef="capacidade">
        <th mat-header-cell *matHeaderCellDef>Capacidade</th>
        <td mat-cell *matCellDef="let element">{{ element.capacidade }}</td>
      </ng-container>

      <ng-container matColumnDef="ingressosDisponiveis">
        <th mat-header-cell *matHeaderCellDef>ingressos Disponiveis</th>
        <td mat-cell *matCellDef="let element">{{ element.ingressosDisponiveis }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" (click)="verCompras(element.id)">
            <mat-icon>group</mat-icon>
          </button>
          <button mat-icon-button color="primary">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletar(element.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="8" showFirstLastButtons></mat-paginator>
  </div>
  <app-sidebar></app-sidebar>
