<app-overlay [mostrar]="mostrarOverlay()" [mensagem]="mensagemOverlay()" (closed)="fecharOverlay()"></app-overlay>
@if (criarBalada == false) {
  <div class="table-container">
    <br>
    <h2>Baladas</h2>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="nomeEvento">
        <th mat-header-cell *matHeaderCellDef>Evento</th>
        <td mat-cell *matCellDef="let element">{{ element.nomeEvento }}</td>
      </ng-container>

      <ng-container matColumnDef="local">
        <th mat-header-cell *matHeaderCellDef>Local</th>
        <td mat-cell *matCellDef="let element">{{ element.local }}</td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let element">{{ element.data}}</td>
      </ng-container>

      <ng-container matColumnDef="capacidade">
        <th mat-header-cell *matHeaderCellDef>Capacidade</th>
        <td mat-cell *matCellDef="let element">{{ element.capacidade }}</td>
      </ng-container>

      <ng-container matColumnDef="ingressosDisponiveis">
        <th mat-header-cell *matHeaderCellDef>ingressos Disponiveis</th>
        <td mat-cell *matCellDef="let element">{{ element.ingressosDisponiveis }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" (click)="verCompras(element.id)">
            <mat-icon>group</mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="editar(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletar(element.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSize]="8" showFirstLastButtons></mat-paginator>
    <br>
    <button class='btn block-cube block-cube-hover btn-third' type='button' (click)="criarBalada = true">
      <div class='bg-top'>
        <div class='bg-inner'></div>
      </div>
      <div class='bg-right'>
        <div class='bg-inner'></div>
      </div>
      <div class='bg'>
        <div class='bg-inner'></div>
      </div>
      <div class='text'>
        Criar Balada
      </div>
    </button>
  </div>
}
@else{
<form autocomplete='off' class='form' (ngSubmit)="salvar()">
  <div class='control'>
    <h1>
      {{ editando ? 'Editar Balada' : 'Criar Balada' }}
    </h1>
  </div>
  <div class='control block-cube block-input'>
    <input name='nomeEvento' placeholder='Nome do Evento' type='text' [(ngModel)]="balada.nomeEvento" required>
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
  </div>
  <div class='control block-cube block-input'>
    <input name='data' placeholder='Data' type='date' [(ngModel)]="balada.data" required>
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
  </div>
  <div class='control block-cube block-input'>
    <input name='local' placeholder='Local' type='text' [(ngModel)]="balada.local" required>
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
  </div>
  <div class='control block-cube block-input'>
    <input name='capacidade' placeholder='Capacidade' type='number' [(ngModel)]="balada.capacidade" required>
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
  </div>
  <div class='control block-cube block-input'>
    <input name='ingressosDisponiveis' placeholder='Quant. de Ingressos Disponiveis' type='number' [(ngModel)]="balada.ingressosDisponiveis" required>
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
  </div>
  <div class='control block-cube block-input'>
    <input name='valorInvestido' placeholder='Valor Investido' type='number' [(ngModel)]="balada.valorInvestido" required>
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
  </div>
  <div class='control block-cube block-input'>
    <input name='receitaEstimada' placeholder='Receita Estimada' type='number' [(ngModel)]="balada.receitaEstimada" required>
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
  </div>
  <button class='btn block-cube block-cube-hover' type='button' (click)="salvar()">
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
    <div class='text'>
      {{ editando ? 'Salvar' : 'Criar' }}
    </div>
  </button>
  <br>
  <button class='btn block-cube block-cube-hover btn-secondary' type='button' (click)="voltar()">
    <div class='bg-top'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg-right'>
      <div class='bg-inner'></div>
    </div>
    <div class='bg'>
      <div class='bg-inner'></div>
    </div>
    <div class='text'>
      Voltar
    </div>
  </button>
</form>
}
<app-sidebar></app-sidebar>
